<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Windows 95 - Unrestricted Drag with 4-Color Icon</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Tahoma', 'MS Sans Serif', sans-serif;
            font-size: 11px;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #008080;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* --- Desktop Icons --- */
        #desktop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 28px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 15px;
        }

        .icon {
            width: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            color: white;
            text-shadow: 1px 1px 0 #000;
        }

        .icon:hover .icon-title {
            background-color: #000080;
        }

        .icon-symbol {
            font-size: 30px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }
        
        .doom-desktop-icon {
            background: #c0c0c0;
            border: 2px outset #fff;
            color: #000;
            font-size: 11px;
            font-weight: bold;
        }

        .icon-title {
            padding: 1px 3px;
            border: 1px transparent dotted;
            word-wrap: break-word;
        }

        /* --- 4-Color Windows Flag CSS Icon --- */
        .win-icon-4color {
            width: 18px;
            height: 18px;
            display: inline-grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 1px;
            vertical-align: middle;
        }
        .win-sq-red { background-color: #ff0000; }
        .win-sq-green { background-color: #008000; }
        .win-sq-blue { background-color: #0000ff; }
        .win-sq-yellow { background-color: #ffff00; }

        /* --- Windows 95 Window Frame --- */
        .window {
            position: absolute;
            background: #C0C0C0;
            border-top: 2px solid #FFFFFF;
            border-left: 2px solid #FFFFFF;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            box-shadow: 1px 1px 0 #808080, inset -1px -1px 0 #808080;
            display: flex;
            flex-direction: column;
            min-width: 250px;
            min-height: 180px;
            z-index: 10;
        }

        .window.active {
            z-index: 100;
        }

        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: calc(100vh - 28px) !important;
            border: none;
            box-shadow: none;
        }

        .title-bar {
            background: #808080;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #C0C0C0;
            font-weight: bold;
            height: 18px;
            cursor: default;
        }

        .window.active .title-bar {
            background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
            color: white;
        }

        .title-text {
            display: flex;
            align-items: center;
            gap: 4px;
            overflow: hidden;
            white-space: nowrap;
            cursor: move;
            flex: 1;
        }

        .window-controls {
            display: flex;
            gap: 2px;
        }

        .win-btn {
            width: 16px;
            height: 14px;
            background: #C0C0C0;
            border-top: 1px solid #FFFFFF;
            border-left: 1px solid #FFFFFF;
            border-right: 1px solid #000000;
            border-bottom: 1px solid #000000;
            box-shadow: inset -1px -1px 0 #808080;
            color: #000;
            font-size: 9px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            line-height: 1;
        }

        .win-btn:active {
            border-top: 1px solid #000000;
            border-left: 1px solid #000000;
            border-right: 1px solid #FFFFFF;
            border-bottom: 1px solid #FFFFFF;
            box-shadow: none;
            padding-top: 1px;
            padding-left: 1px;
        }

        .menu-bar {
            display: flex;
            gap: 12px;
            padding: 2px 6px;
            border-bottom: 1px solid #808080;
            background: #C0C0C0;
        }

        .menu-item {
            cursor: pointer;
            padding: 1px 4px;
        }

        .menu-item:hover {
            background: #000080;
            color: white;
        }

        .window-body {
            flex: 1;
            padding: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #C0C0C0;
        }

        .inset-panel {
            background: white;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #FFFFFF;
            border-bottom: 2px solid #FFFFFF;
            box-shadow: inset 1px 1px 0 #000000;
            flex: 1;
            padding: 0;
            overflow: auto;
            position: relative;
        }

        /* --- Taskbar --- */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 28px;
            background: #C0C0C0;
            border-top: 2px solid #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px;
            z-index: 10000;
        }

        .start-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
            background: #C0C0C0;
            border-top: 2px solid #FFFFFF;
            border-left: 2px solid #FFFFFF;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            box-shadow: inset -1px -1px 0 #808080;
            padding: 2px 6px;
            height: 22px;
            cursor: pointer;
        }

        .start-btn.active, .start-btn:active {
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #FFFFFF;
            border-bottom: 2px solid #FFFFFF;
            box-shadow: none;
            padding-top: 3px;
            padding-left: 7px;
        }

        #task-list {
            display: flex;
            gap: 2px;
            flex: 1;
            margin: 0 4px;
            overflow-x: auto;
        }

        .task-item {
            background: #C0C0C0;
            border-top: 2px solid #FFFFFF;
            border-left: 2px solid #FFFFFF;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            box-shadow: inset -1px -1px 0 #808080;
            padding: 2px 6px;
            height: 22px;
            width: 140px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-item.active {
            background: #e0e0e0;
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #FFFFFF;
            border-bottom: 2px solid #FFFFFF;
            box-shadow: inset 1px 1px 0 #808080;
            font-weight: bold;
        }

        .systray {
            border-top: 1px solid #808080;
            border-left: 1px solid #808080;
            border-right: 1px solid #FFFFFF;
            border-bottom: 1px solid #FFFFFF;
            padding: 2px 8px;
            height: 22px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #C0C0C0;
        }

        /* --- Start Menu --- */
        #start-menu {
            position: fixed;
            bottom: 28px;
            left: 2px;
            width: 180px;
            background: #C0C0C0;
            border-top: 2px solid #FFFFFF;
            border-left: 2px solid #FFFFFF;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            display: none;
            flex-direction: row;
            z-index: 10001;
        }

        .start-banner {
            background: linear-gradient(0deg, #000080, #1084d0);
            width: 26px;
            color: white;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            padding: 6px 2px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            display: flex;
            align-items: flex-end;
        }

        .start-items {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2px 0;
        }

        .start-item {
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .start-item:hover {
            background: #000080;
            color: white;
        }

        .start-divider {
            height: 1px;
            background: #808080;
            border-bottom: 1px solid #FFFFFF;
            margin: 2px 0;
        }

        /* --- Paint Controls --- */
        .paint-toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 4px;
            background: #C0C0C0;
            border-top: 1px solid #808080;
        }

        .paint-palette {
            display: flex;
            gap: 2px;
            background: #808080;
            padding: 2px;
            border: 1px inset #fff;
        }

        .color-swatch {
            width: 14px;
            height: 14px;
            border: 1px solid #000;
            cursor: pointer;
        }

        .color-swatch.selected {
            border: 2px solid #fff;
            outline: 1px solid #000;
        }

        .size-btn {
            background: #C0C0C0;
            border-top: 1px solid #FFFFFF;
            border-left: 1px solid #FFFFFF;
            border-right: 1px solid #000000;
            border-bottom: 1px solid #000000;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 10px;
        }

        .size-btn.active, .size-btn:active {
            border-top: 1px solid #000000;
            border-left: 1px solid #000000;
            border-right: 1px solid #FFFFFF;
            border-bottom: 1px solid #FFFFFF;
            font-weight: bold;
        }

        textarea.notepad-text {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 4px;
        }

        canvas#paint-canvas {
            background: white;
            cursor: crosshair;
            display: block;
            touch-action: none;
        }

        /* --- DOOM 95 Specific Styles --- */
        #viewport-container {
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            border: 3px inset #DFDFDF;
        }

        #gameCanvas {
            display: block;
            background: #000;
            width: 100%;
            height: 320px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* DOOM HUD */
        #hud {
            width: 100%;
            height: 52px;
            border-top: 3px solid #555555;
            display: grid;
            grid-template-columns: 1.2fr 1.2fr 1fr 1.2fr 1.2fr;
            padding: 3px;
            gap: 4px;
            background: linear-gradient(180deg, #3a3a3a 0%, #1a1a1a 100%);
        }
        .hud-panel {
            background: #000;
            border: 2px inset #666;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hud-label {
            font-size: 9px;
            color: #B00000;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .hud-value {
            font-size: 22px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            color: #FF0000;
            text-shadow: 0 0 4px #800000;
            line-height: 1;
        }
        #face-panel {
            background: #111;
            border: 2px inset #666;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #face {
            width: 38px;
            height: 38px;
            background: #700000;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Touch Controls Overlay for DOOM */
        #touch-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 320px;
            pointer-events: none;
            z-index: 50;
        }
        #joystick-area {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            pointer-events: auto;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
        }
        .touch-btn {
            position: absolute;
            background: rgba(180, 0, 0, 0.4);
            border: 2px outset rgba(255, 255, 255, 0.6);
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            pointer-events: auto;
        }
        #btn-turn-left { bottom: 65px; right: 100px; width: 45px; height: 45px; }
        #btn-turn-right { bottom: 65px; right: 10px; width: 45px; height: 45px; }
        #btn-fire { bottom: 10px; right: 10px; width: 135px; height: 48px; background: rgba(200, 0, 0, 0.7); font-size: 15px; }

        /* Game Over / Start Overlays for DOOM */
        .doom-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            text-align: center;
            padding: 20px;
        }
        .doom-overlay h1 { color: #B00000; font-size: 32px; margin: 0 0 10px 0; text-shadow: 2px 2px #000; font-family: 'Impact', sans-serif; letter-spacing: 2px; }
        .doom-overlay p { color: #ccc; font-size: 12px; max-width: 400px; line-height: 1.4; margin: 4px 0; }
        .btn-doom {
            background: #C0C0C0;
            color: #000;
            border: 2px outset #FFFFFF;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-doom:active { border-style: inset; }
    </style>
</head>

        function openApp(appId) {

            winEl.className = 'window active';

            winEl.style.height = app.height + 'px';
            
            const offset = Object.keys(openWindows).length * 20 + 30;
            winEl.style.top = offset + 'px';
            winEl.style.left = offset + 'px';

            const iconMarkup = app.iconTag ? app.iconTag : `<span>${app.icon}</span>`;

            winEl.innerHTML = `

            winEl.addEventListener('pointerdown', () => focusWindow(appId));

            openWindows[appId] = winEl;

        function focusWindow(appId) {
            Object.keys(openWindows).forEach(id => {
                openWindows[id].classList.remove('active');
                const task = document.getElementById(`task-${id}`);
                if (task) task.classList.remove('active');

        // Unrestricted Left Window Dragging Implementation
        let dragOffset = { x: 0, y: 0 };
        let draggingAppId = null;

        function startDrag(e, appId) {
            const win = openWindows[appId];
            if (win.classList.contains('maximized')) return;
            
            draggingAppId = appId;
            focusWindow(appId);
            
            dragOffset.x = e.clientX - win.offsetLeft;
            dragOffset.y = e.clientY - win.offsetTop;

            window.addEventListener('pointermove', onDrag);
            window.addEventListener('pointerup', stopDrag);
            e.preventDefault();
        }

        function onDrag(e) {
            if (!draggingAppId) return;
            const win = openWindows[draggingAppId];
            if (!win) return;
            
            let newLeft = e.clientX - dragOffset.x;
            let newTop = e.clientY - dragOffset.y;
            
            // Allow dragging past the left edge completely, but keep top protected
            win.style.left = newLeft + 'px';
            win.style.top = Math.max(0, newTop) + 'px';
        }

        function stopDrag() {
            draggingAppId = null;
            window.removeEventListener('pointermove', onDrag);
            window.removeEventListener('pointerup', stopDrag);
        }

        function initPaintCanvas() {
            const canvas = document.getElementById('paint-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            }

            function draw(e) {
                if (!isDrawing) return;
                const pos = getPos(e);
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = currentSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }

            canvas.onpointerdown = (e) => {
                isDrawing = true;
                canvas.setPointerCapture(e.pointerId);
                const pos = getPos(e);

                ctx.fillStyle = currentColor;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, currentSize / 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                e.preventDefault();
            };

            canvas.onpointermove = (e) => { if (isDrawing) { draw(e); e.preventDefault(); } };
            canvas.onpointerup = (e) => {
                if (isDrawing) {
                    isDrawing = false;
                    try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
                    ctx.beginPath();
                }
            };
            canvas.onpointercancel = canvas.onpointerup;
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                if (type === 'shotgun') {
                    const bufferSize = audioCtx.sampleRate * 0.25;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(600, audioCtx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.25);
                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                    noise.start();
                } else if (type === 'pain') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'item') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                }
            } catch(e) {}
        }

                let dx = clientX - centerX;
                let dy = clientY - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxRadius = 35;

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                touchState.forward = -dy / maxRadius;
                touchState.side = dx / maxRadius;

            playSound('shotgun');
            updateFace('shoot');

            enemies.forEach(enemy => {
                if (enemy.health <= 0) return;
                let dx = enemy.x - player.x;
                let dy = enemy.y - player.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                let angleToEnemy = Math.atan2(dy, dx);
                let diff = angleToEnemy - player.angle;

                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;

                if (Math.abs(diff) < 0.45 && dist < 6.0) {
                    enemy.health -= 30;
                    enemy.state = 'alert';
                    if (enemy.health <= 0) {
                        player.kills++;
                        if (player.kills >= player.maxKills) triggerVictory();
                    }
                }
            });
        }

        function updateFace(type) {
            faceTimer = 25;
            if (type === 'shoot') faceExpression = '😠';
            else if (type === 'pain') faceExpression = '😱';
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            const endTitle = document.getElementById('end-title');
            const endDesc = document.getElementById('end-desc');
            const endOverlay = document.getElementById('end-overlay');
            if(endTitle) endTitle.innerText = 'YOU DIED';
            if(endDesc) endDesc.innerText = 'The demons consumed your flesh.';
            if(endOverlay) endOverlay.style.display = 'flex';
        }

        function triggerVictory() {
            gameState = 'VICTORY';
            const endTitle = document.getElementById('end-title');
            const endDesc = document.getElementById('end-desc');
            const endOverlay = document.getElementById('end-overlay');
            if(endTitle) endTitle.innerText = 'VICTORY!';
            if(endDesc) endDesc.innerText = 'All demons eradicated! UAC Base secured.';
            if(endOverlay) endOverlay.style.display = 'flex';
        }

        function updateDoom() {
            if (gameState !== 'PLAYING') return;

            let moveSpeed = 0.038;
            let rotSpeed = 0.032;
            let forward = touchState.forward;
            let side = touchState.side;
            let turn = 0;

            if (keys['KeyW'] || keys['ArrowUp']) forward += 1;
            if (keys['KeyS'] || keys['ArrowDown']) forward -= 1;
            if (keys['KeyA']) side -= 1;
            if (keys['KeyD']) side += 1;
            if (keys['ArrowLeft'] || keys['KeyQ'] || touchState.turnLeft) turn -= 1;
            if (keys['ArrowRight'] || keys['KeyE'] || touchState.turnRight) turn += 1;

            player.angle += turn * rotSpeed;

            let cos = Math.cos(player.angle);
            let sin = Math.sin(player.angle);
            let nx = player.x + (cos * forward - sin * side) * moveSpeed;
            let ny = player.y + (sin * forward + cos * side) * moveSpeed;

            if (map[Math.floor(player.y)][Math.floor(nx)] === 0) player.x = nx;
            if (map[Math.floor(ny)][Math.floor(player.x)] === 0) player.y = ny;

            enemies.forEach(enemy => {
                if (enemy.health <= 0) return;
                let dx = player.x - enemy.x;
                let dy = player.y - enemy.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 4.5) {
                    enemy.state = 'alert';
                    if (dist < 1.2 && Math.random() < 0.08) {
                        let dmg = Math.floor(Math.random() * 8) + 4;
                        if (player.armor > 0) {
                            player.armor -= dmg;
                            if (player.armor < 0) { player.health += player.armor; player.armor = 0; }
                        } else {
                            player.health -= dmg;
                        }
                        playSound('pain');
                        updateFace('pain');
                        if (player.health <= 0) {
                            player.health = 0;
                            triggerGameOver();
                        }
                    }
                }
            });

            items.forEach(item => {
                if (!item.collected) {
                    let dist = Math.sqrt(Math.pow(item.x - player.x, 2) + Math.pow(item.y - player.y, 2));
                    if (dist < 0.5) {
                        item.collected = true;
                        playSound('item');
                        if (item.type === 'health') player.health = Math.min(100, player.health + 25);
                        if (item.type === 'ammo') player.ammo += 10;
                        if (item.type === 'armor') player.armor = Math.min(100, player.armor + 25);
                    }
                }
            });

            if (faceTimer > 0) {
                faceTimer--;
                if (faceTimer === 0) faceExpression = '😁';
            }

            if(document.getElementById('hud-health')) {
                document.getElementById('hud-health').innerText = player.health;
                document.getElementById('hud-armor').innerText = player.armor;
                document.getElementById('hud-ammo').innerText = player.ammo;
                document.getElementById('hud-kills').innerText = `${player.kills}/${player.maxKills}`;
                document.getElementById('face').innerText = faceExpression;
            }
        }

        function renderDoom() {
            if (!doomCtx) return;

            doomCtx.fillStyle = '#1A1A1A'; doomCtx.fillRect(0, 0, screenWidth, screenHeight / 2);
            doomCtx.fillStyle = '#2C2C2C'; doomCtx.fillRect(0, screenHeight / 2, screenWidth, screenHeight / 2);

            let zBuffer = new Array(screenWidth);

            for (let x = 0; x < screenWidth; x++) {
                let cameraX = 2 * x / screenWidth - 1;
                let rayAngle = player.angle + Math.atan(cameraX * Math.tan(player.fov / 2));

                let rayDirX = Math.cos(rayAngle);
                let rayDirY = Math.sin(rayAngle);

                let mapX = Math.floor(player.x);
                let mapY = Math.floor(player.y);

                let sideDistX, sideDistY;
                let deltaDistX = Math.abs(1 / rayDirX);
                let deltaDistY = Math.abs(1 / rayDirY);
                let perpWallDist;

                let stepX, stepY;
                let hit = 0;
                let side = 0;

                if (rayDirX < 0) { stepX = -1; sideDistX = (player.x - mapX) * deltaDistX; }
                else { stepX = 1; sideDistX = (mapX + 1.0 - player.x) * deltaDistX; }

                if (rayDirY < 0) { stepY = -1; sideDistY = (player.y - mapY) * deltaDistY; }
                else { stepY = 1; sideDistY = (mapY + 1.0 - player.y) * deltaDistY; }

                while (hit === 0) {
                    if (sideDistX < sideDistY) {
                        sideDistX += deltaDistX; mapX += stepX; side = 0;
                    } else {
                        sideDistY += deltaDistY; mapY += stepY; side = 1;
                    }
                    if (map[mapY][mapX] > 0) hit = map[mapY][mapX];
                }

                if (side === 0) perpWallDist = (mapX - player.x + (1 - stepX) / 2) / rayDirX;
                else perpWallDist = (mapY - player.y + (1 - stepY) / 2) / rayDirY;

                zBuffer[x] = perpWallDist;

                let lineHeight = Math.floor(screenHeight / perpWallDist);
                let drawStart = Math.floor(-lineHeight / 2 + screenHeight / 2);

                let wallX;
                if (side === 0) wallX = player.y + perpWallDist * rayDirY;
                else          wallX = player.x + perpWallDist * rayDirX;
                wallX -= Math.floor(wallX);

                let texX = Math.floor(wallX * TEX_SIZE);
                if (side === 0 && rayDirX > 0) texX = TEX_SIZE - texX - 1;
                if (side === 1 && rayDirY < 0) texX = TEX_SIZE - texX - 1;

                let activeTex = (hit === 2) ? techTex : brickTex;

                doomCtx.drawImage(activeTex, texX, 0, 1, TEX_SIZE, x, drawStart, 1, lineHeight);

                let shadowAlpha = Math.min(0.85, Math.max(0, perpWallDist / 10));
                if (side === 1) shadowAlpha = Math.min(0.9, shadowAlpha + 0.2);
                doomCtx.fillStyle = `rgba(0, 0, 0, ${shadowAlpha})`;
                doomCtx.fillRect(x, drawStart, 1, lineHeight);
            }

            let sprites = [];
            enemies.forEach(en => { if (en.health > 0) sprites.push({ x: en.x, y: en.y, type: 'enemy' }); });
            items.forEach(it => { if (!it.collected) sprites.push({ x: it.x, y: it.y, type: it.type }); });

            sprites.sort((a, b) => {
                let distA = Math.pow(player.x - a.x, 2) + Math.pow(player.y - a.y, 2);
                let distB = Math.pow(player.x - b.x, 2) + Math.pow(player.y - b.y, 2);
                return distB - distA;
            });

            sprites.forEach(sprite => {
                let spriteX = sprite.x - player.x;
                let spriteY = sprite.y - player.y;

                let carX = spriteX * Math.sin(player.angle) - spriteY * Math.cos(player.angle);
                let carY = spriteX * Math.cos(player.angle) + spriteY * Math.sin(player.angle);

                if (carY > 0.1) {
                    let spriteScreenX = Math.floor((screenWidth / 2) * (1 + carX / carY / Math.tan(player.fov / 2)));
                    let spriteHeight = Math.abs(Math.floor(screenHeight / carY));
                    let drawStartY = Math.max(0, Math.floor(-spriteHeight / 2 + screenHeight / 2));
                    let drawEndY = Math.min(screenHeight, Math.floor(spriteHeight / 2 + screenHeight / 2));
                    let spriteWidth = Math.abs(Math.floor(screenHeight / carY));
                    let drawStartX = Math.max(0, Math.floor(-spriteWidth / 2 + spriteScreenX));
                    let drawEndX = Math.min(screenWidth, Math.floor(spriteWidth / 2 + spriteScreenX));

                    for (let stripe = drawStartX; stripe < drawEndX; stripe++) {
                        if (carY < zBuffer[stripe]) {
                            if (sprite.type === 'enemy') {
                                let texX = Math.floor(((stripe - (-spriteWidth / 2 + spriteScreenX)) / spriteWidth) * TEX_SIZE);
                                if (texX >= 0 && texX < TEX_SIZE) {
                                    doomCtx.drawImage(demonTex, texX, 0, 1, TEX_SIZE, stripe, drawStartY, 1, drawEndY - drawStartY);
                                }
                            } else if (sprite.type === 'health') {
                                doomCtx.fillStyle = '#FFF';
                                doomCtx.fillRect(stripe, drawStartY + (drawEndY - drawStartY) * 0.5, 1, 4);
                                doomCtx.fillStyle = '#F00';
                                doomCtx.fillRect(stripe, drawStartY + (drawEndY - drawStartY) * 0.55, 1, 2);
                            } else if (sprite.type === 'ammo') {
                                doomCtx.fillStyle = '#D2B48C';
                                doomCtx.fillRect(stripe, drawStartY + (drawEndY - drawStartY) * 0.6, 1, 3);
                            } else if (sprite.type === 'armor') {
                                doomCtx.fillStyle = '#00FF00';
                                doomCtx.fillRect(stripe, drawStartY + (drawEndY - drawStartY) * 0.5, 1, 3);
                            }
                        }
                    }
                }
            });

            let gunX = screenWidth / 2 - 20;
            let gunY = screenHeight - 45 + (gunFlash > 0 ? 8 : 0);
            doomCtx.fillStyle = '#1A1A1A'; doomCtx.fillRect(gunX, gunY + 15, 40, 30);
            doomCtx.fillStyle = '#333333'; doomCtx.fillRect(gunX + 10, gunY, 20, 20);
            if (gunFlash > 0) {
                gunFlash--;
                doomCtx.fillStyle = '#FFFF00';
                doomCtx.beginPath(); doomCtx.arc(screenWidth / 2, gunY - 4, 16, 0, Math.PI * 2); doomCtx.fill();
            }

            const mapScale = 3.0; const mapOffsetX = 6; const mapOffsetY = 6;
            doomCtx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            doomCtx.fillRect(mapOffsetX - 2, mapOffsetY - 2, map[0].length * mapScale + 4, map.length * mapScale + 4);

            for (let my = 0; my < map.length; my++) {
                for (let mx = 0; mx < map[my].length; mx++) {
                    if (map[my][mx] > 0) {
                        doomCtx.fillStyle = map[my][mx] === 2 ? '#4A525A' : '#777';
                        doomCtx.fillRect(mapOffsetX + mx * mapScale, mapOffsetY + my * mapScale, mapScale, mapScale);
                    }
                }
            }

            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    doomCtx.fillStyle = '#FF0000';
                    doomCtx.fillRect(mapOffsetX + enemy.x * mapScale - 1, mapOffsetY + enemy.y * mapScale - 1, 2.5, 2.5);
                }
            });

            let pMapX = mapOffsetX + player.x * mapScale;
            let pMapY = mapOffsetY + player.y * mapScale;
            doomCtx.fillStyle = '#FFFF00';
            doomCtx.beginPath(); doomCtx.arc(pMapX, pMapY, 2, 0, Math.PI * 2); doomCtx.fill();
        }

        function doomLoop() {
            requestAnimationFrame(doomLoop);
            if (!document.getElementById('gameCanvas')) return;
            updateDoom();
            renderDoom();
        }

        openApp('paint');

    </script>
</body>
